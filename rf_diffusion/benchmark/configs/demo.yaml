defaults:
  - pipeline

sweep:
  command_args: >
    --config-name=aa
    inference.ckpt_path=
      ${oc.env:RFDIFFUSION2_WEIGHTS_DIR}/RFD_173.pt
    diffuser.T=50
    inference.deterministic=True
  benchmark_json: demo.json
  benchmarks: all
  num_per_condition: 1
  num_per_job: 1
  stop_step: sweep

outdir: /net/scratch/${oc.env:USER}/se3_diffusion/benchmarks/${now:%Y-%m-%d}_${now:%H-%M-%S}_demo
