defaults:
  - aa_ppi
  - _self_

inference:
  input_pdb: rf_diffusion/examples/inputs/fcrn_human_af_B.pdb
  output_prefix: outputs/fcrn_binder/design
  num_designs: 1
  write_extra_ts: [30, 20, 10]
  custom_t_range: [50, 49, 48, 47, 46, 45, 44, 43, 42, 41, 40, 38, 36, 34, 32, 30, 27, 23, 20, 17, 14, 10, 7, 4, 1]
  start_str_self_cond_at_t: 42

contigmap:
  contigs: ['65-120,0_B1-151']
  has_termini: [false, false]

ppi:
  hotspot_res: 'B44,B49,B50,B56,B58'

transforms:
  configs:
    CenterPostTransform:
      center_type: hotspot

upstream_inference_transforms:
  configs:
    SSSprinkleTransform:
      active: true
      background: HELIX
      min_mask: 2
      max_mask: 4
      spread_efficiency: 0.7
